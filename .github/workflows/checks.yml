name: source-checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DASHSCOPE_API_KEY: unit-test-no-provider-access
      AGENT_BASE_MODEL: unit-test-model
      BASE_URL: http://127.0.0.1:9/v1
      PYTHONUTF8: '1'
      RAGAS_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend frontend evaluation deploy scripts echomind_skills
      - run: python scripts/run_checks.py
      - run: git diff --check
